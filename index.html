<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EFE6" />
    <title>AmaToPro — học tiếng Anh mỗi ngày</title>
    <script>
      // Áp theme trước khi React render để tránh nháy màu
      try {
        var s = JSON.parse(localStorage.getItem('amatopro:v1') || '{}')
        var t = (s.state && s.state.settings && s.state.settings.theme) || 'system'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
